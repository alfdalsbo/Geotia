<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Riksvåpen for Min geot">
  <title>Riksvåpen — Min geot</title>
  <defs>
    <linearGradient id="vm-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3a55"/><stop offset="100%" stop-color="#061a26"/>
    </linearGradient>
    <linearGradient id="vm-band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e1d27"/><stop offset="100%" stop-color="#3a0e15"/>
    </linearGradient>
    <linearGradient id="vm-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1c06c"/><stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <path id="vm-shield-path" d="M 30 30 L 210 30 L 210 140 Q 210 220 120 260 Q 30 220 30 140 Z"/>
  </defs>

  <g stroke="#7e5a18" stroke-width="1" fill="url(#vm-gold)" opacity="0.85">
    <g transform="translate(20 145) rotate(-12)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
    <g transform="translate(220 145) rotate(12) scale(-1 1)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
  </g>

  <use href="#vm-shield-path" fill="url(#vm-shield)" stroke="#b8892f" stroke-width="2"/>

  <!-- Sirkulært monogram-felt -->
  <g transform="translate(120 135)">
    <circle r="62" fill="#f5ead0" stroke="#b8892f" stroke-width="2"/>
    <circle r="56" fill="none" stroke="#b8892f" stroke-width="0.8" opacity="0.6"/>
    <!-- Beading -->
    <g fill="#7e5a18">
      <circle cx="0" cy="-59" r="1.2"/>
      <circle cx="34" cy="-48" r="1.2"/>
      <circle cx="55" cy="-21" r="1.2"/>
      <circle cx="59" cy="13" r="1.2"/>
      <circle cx="42" cy="42" r="1.2"/>
      <circle cx="13" cy="59" r="1.2"/>
      <circle cx="-21" cy="55" r="1.2"/>
      <circle cx="-48" cy="34" r="1.2"/>
      <circle cx="-59" cy="0" r="1.2"/>
      <circle cx="-48" cy="-34" r="1.2"/>
      <circle cx="-21" cy="-55" r="1.2"/>
    </g>
    <!-- Stilisert "G" som monogram -->
    <text x="0" y="22" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="78" fill="#0a2b3f">G</text>
    <!-- Liten kompass-stjerne under -->
    <g transform="translate(0 36)">
      <path d="M 0 -6 L 1 -1 L 6 0 L 1 1 L 0 6 L -1 1 L -6 0 L -1 -1 Z" fill="#5e1d27"/>
    </g>
  </g>

  <g transform="translate(120 250)">
    <path d="M -76 0 L -88 8 L -88 22 L 88 22 L 88 8 L 76 0 L 70 6 L -70 6 Z" fill="url(#vm-band)" stroke="#b8892f" stroke-width="1"/>
    <text x="0" y="17" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="9" fill="#f5d27a" letter-spacing="4">MIN · GEOT</text>
  </g>
</svg>
