<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Riksvåpen for Tabellene">
  <title>Riksvåpen — Tabellene</title>
  <defs>
    <linearGradient id="vb-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3a55"/><stop offset="100%" stop-color="#061a26"/>
    </linearGradient>
    <linearGradient id="vb-band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e1d27"/><stop offset="100%" stop-color="#3a0e15"/>
    </linearGradient>
    <linearGradient id="vb-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1c06c"/><stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <path id="vb-shield-path" d="M 30 30 L 210 30 L 210 140 Q 210 220 120 260 Q 30 220 30 140 Z"/>
  </defs>

  <g stroke="#7e5a18" stroke-width="1" fill="url(#vb-gold)" opacity="0.85">
    <g transform="translate(20 145) rotate(-12)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
    <g transform="translate(220 145) rotate(12) scale(-1 1)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
  </g>

  <use href="#vb-shield-path" fill="url(#vb-shield)" stroke="#b8892f" stroke-width="2"/>

  <!-- Vekt på toppen -->
  <g transform="translate(120 90)">
    <!-- Vektarm -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#vb-gold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Sentral hengsel -->
    <circle r="4" fill="url(#vb-gold)" stroke="#7e5a18" stroke-width="0.6"/>
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="url(#vb-gold)" stroke-width="2"/>
    <circle cx="0" cy="-22" r="3" fill="url(#vb-gold)"/>
    <!-- Venstre vektskål -->
    <line x1="-60" y1="0" x2="-72" y2="14" stroke="#b8892f" stroke-width="0.8"/>
    <line x1="-60" y1="0" x2="-48" y2="14" stroke="#b8892f" stroke-width="0.8"/>
    <path d="M -75 14 Q -60 26 -45 14 Q -60 20 -75 14 Z" fill="url(#vb-gold)" stroke="#7e5a18" stroke-width="0.8"/>
    <!-- Høyre vektskål -->
    <line x1="60" y1="0" x2="48" y2="14" stroke="#b8892f" stroke-width="0.8"/>
    <line x1="60" y1="0" x2="72" y2="14" stroke="#b8892f" stroke-width="0.8"/>
    <path d="M 45 14 Q 60 26 75 14 Q 60 20 45 14 Z" fill="url(#vb-gold)" stroke="#7e5a18" stroke-width="0.8"/>
  </g>

  <!-- Hierarki-trapp (3 trinn) -->
  <g transform="translate(120 200)">
    <!-- Trinn 1 (lavest, bredest) -->
    <rect x="-50" y="20" width="100" height="14" fill="#f5ead0" stroke="#7e5a18" stroke-width="1"/>
    <text x="0" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="10" fill="#0a2b3f">III</text>
    <!-- Trinn 2 -->
    <rect x="-35" y="2" width="70" height="14" fill="#e7c599" stroke="#7e5a18" stroke-width="1"/>
    <text x="0" y="13" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="10" fill="#3a0e15">II</text>
    <!-- Trinn 3 (høyest, smalest) -->
    <rect x="-22" y="-16" width="44" height="14" fill="url(#vb-gold)" stroke="#7e5a18" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="10" fill="#3a0e15">I</text>
  </g>

  <g transform="translate(120 250)">
    <path d="M -76 0 L -88 8 L -88 22 L 88 22 L 88 8 L 76 0 L 70 6 L -70 6 Z" fill="url(#vb-band)" stroke="#b8892f" stroke-width="1"/>
    <text x="0" y="17" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="9" fill="#f5d27a" letter-spacing="4">RIKETS · TABELLER</text>
  </g>
</svg>
