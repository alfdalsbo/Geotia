<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Riksvåpen for Tredje Kollegium">
  <title>Riksvåpen — Tredje Kollegium</title>
  <defs>
    <linearGradient id="vk3-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3a55"/><stop offset="100%" stop-color="#061a26"/>
    </linearGradient>
    <linearGradient id="vk3-band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e1d27"/><stop offset="100%" stop-color="#3a0e15"/>
    </linearGradient>
    <linearGradient id="vk3-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1c06c"/><stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <radialGradient id="vk3-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5ead0"/>
      <stop offset="40%" stop-color="#e1c06c"/>
      <stop offset="100%" stop-color="#7e5a18"/>
    </radialGradient>
    <path id="vk3-shield-path" d="M 30 30 L 210 30 L 210 140 Q 210 220 120 260 Q 30 220 30 140 Z"/>
  </defs>

  <!-- Lauerkranser -->
  <g stroke="#7e5a18" stroke-width="1" fill="url(#vk3-gold)" opacity="0.85">
    <g transform="translate(20 145) rotate(-12)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
    <g transform="translate(220 145) rotate(12) scale(-1 1)">
      <path d="M 0 0 Q -8 -14 -4 -28 Q 4 -42 0 -56 Q -8 -70 -2 -84" fill="none" stroke="#7e5a18" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-14" rx="5" ry="11" transform="rotate(-30 -8 -14)"/>
      <ellipse cx="2" cy="-28" rx="5" ry="11" transform="rotate(30 2 -28)"/>
      <ellipse cx="-8" cy="-42" rx="5" ry="11" transform="rotate(-30 -8 -42)"/>
      <ellipse cx="2" cy="-56" rx="5" ry="11" transform="rotate(30 2 -56)"/>
      <ellipse cx="-8" cy="-70" rx="5" ry="11" transform="rotate(-30 -8 -70)"/>
      <ellipse cx="2" cy="-84" rx="4" ry="9" transform="rotate(30 2 -84)"/>
    </g>
  </g>

  <use href="#vk3-shield-path" fill="url(#vk3-shield)" stroke="#b8892f" stroke-width="2"/>

  <!-- Triangel av tre stoler/segl -->
  <g transform="translate(120 140)">
    <!-- Triangel-ramme -->
    <path d="M 0 -56 L 50 30 L -50 30 Z" fill="none" stroke="url(#vk3-gold)" stroke-width="2" opacity="0.7"/>
    <!-- Tre stoler/sirkulære segl i hjørnene -->
    <g>
      <!-- Topp: SS -->
      <circle cx="0" cy="-56" r="14" fill="#061a26" stroke="url(#vk3-gold)" stroke-width="1.5"/>
      <text x="0" y="-52" text-anchor="middle" font-family="'Cinzel',serif" font-weight="900" font-size="11" fill="#e1c06c">SS</text>
      <!-- Venstre nederst: PKK -->
      <circle cx="-50" cy="30" r="14" fill="#061a26" stroke="url(#vk3-gold)" stroke-width="1.5"/>
      <text x="-50" y="34" text-anchor="middle" font-family="'Cinzel',serif" font-weight="900" font-size="10" fill="#e1c06c">PKK</text>
      <!-- Høyre nederst: IRA -->
      <circle cx="50" cy="30" r="14" fill="#061a26" stroke="url(#vk3-gold)" stroke-width="1.5"/>
      <text x="50" y="34" text-anchor="middle" font-family="'Cinzel',serif" font-weight="900" font-size="10" fill="#e1c06c">IRA</text>
    </g>
    <!-- Sentralt øye -->
    <g>
      <ellipse cx="0" cy="0" rx="22" ry="12" fill="#061a26" stroke="url(#vk3-gold)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="url(#vk3-eye)" stroke="#7e5a18" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#061a26"/>
    </g>
  </g>

  <g transform="translate(120 250)">
    <path d="M -82 0 L -94 8 L -94 22 L 94 22 L 94 8 L 82 0 L 76 6 L -76 6 Z" fill="url(#vk3-band)" stroke="#b8892f" stroke-width="1"/>
    <text x="0" y="17" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="9" fill="#f5d27a" letter-spacing="3">TREDJE · KOLLEGIUM</text>
  </g>
</svg>
